name: Publish MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate domain namespace
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_PRIVATE_KEY"
          ./mcp-publisher login dns --domain metasearch.com.tr --private-key "$MCP_PRIVATE_KEY"

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json
